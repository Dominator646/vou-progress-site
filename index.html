<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vou Project | Progress</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-color: #00f2ff;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        .container {
            text-align: center;
            z-index: 1;
        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
            margin-bottom: 40px;
            letter-spacing: 2px;
        /* Эффект Minecraft Glitch */
        .glitch {
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            color: var(--neon-color);
            filter: drop-shadow(0 0 5px var(--neon-color));
        /* Контейнер шкалы */
        .progress-wrapper {
            position: relative;
            width: 80vw;
            max-width: 500px;
        .progress-container {
            height: 24px;
            background: #111;
            border-radius: 12px;
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3), inset 0 0 10px rgba(0, 242, 255, 0.1);
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0077ff, var(--neon-color));
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px var(--neon-color);
        #percent-text {
            margin-top: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-color);
        /* Задний фон для атмосферы */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--neon-color);
            filter: blur(150px);
            opacity: 0.1;
            border-radius: 50%;
            z-index: 0;
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <h1>Прогресс создания сервера Vou<span class="glitch" id="glitch-text">???</span></h1>
        
        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
        <div id="percent-text">0%</div>
    </div>
    <script>
        // 1. Настройки (ЗАМЕНИ НА СВОИ ИЗ SUPABASE)
        const SUPABASE_URL = 'sb_publishable_mdFgb8jLvqq_EWASh7koxw_dftx3lfd';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0bndneWFvb2pwdXZnZG13ZmVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0OTE2MDIsImV4cCI6MjA5NDA2NzYwMn0.TT9d50p3BVLFJ7LeUzsYdcpBO-7dXoV4fxkJnvlx-XU';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        // 2. Логика Minecraft Glitch
        const glitchElement = document.getElementById('glitch-text');
        const chars = "¡¢£¤¥¦§KkABCDEF0123456789";
        setInterval(() => {
            let result = '';
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            glitchElement.innerText = result;
        }, 80);
        // 3. Работа с данными
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');
        function updateUI(value) {
            const safeValue = Math.min(Math.max(value, 0), 100); // Ограничение 0-100
            progressBar.style.width = safeValue + '%';
            percentText.innerText = safeValue + '%';
        async function fetchInitialProgress() {
            const { data, error } = await supabase
                .from('settings')
                .select('value')
                .eq('key', 'progress')
                .single();
            if (data) updateUI(data.value);
            if (error) console.error('Ошибка загрузки:', error);
        // Подписка на Realtime обновления
        supabase
            .channel('schema-db-changes')
            .on('postgres_changes', 
                { event: 'UPDATE', schema: 'public', table: 'settings' }, 
                (payload) => {
                    if (payload.new.key === 'progress') {
                        updateUI(payload.new.value);
                    }
                }
            )
            .subscribe();
        fetchInitialProgress();
    </script>
</body>
</html>
