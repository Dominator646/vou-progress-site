<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<script type="module" src="admin.js"></script>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:40px;
}
input,select{
    display:block;
    margin:10px 0;
    width:300px;
    padding:10px;
button{
    padding:10px 20px;
</style>
</head>
<body>
<h1>ADMIN PANEL</h1>
<button id="login">
    Login Google
</button>
<hr>
<input type="number" id="percent" placeholder="Percent">
<input type="text" id="title"
placeholder="Title">
<input type="number" id="online"
placeholder="Online Count">
<select id="status">
    <option>ONLINE</option>
    <option>OFFLINE</option>
    <option>DEVELOPMENT</option>
</select>
<button id="save">
    SAVE
</body>
</html>
